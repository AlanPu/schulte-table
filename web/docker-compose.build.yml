# 舒尔特表 PWA — 构建镜像版本（可选）
#
# 适合「不想在 NAS 上挂载目录」或「要分发镜像」的场景：
#   docker compose -f docker-compose.build.yml up -d --build
#
# 注意：用这个方式，改 site/ 里的文件必须重新 build 才会生效。

services:
  schulte-table:
    build:
      context: .
      dockerfile: Dockerfile
    image: schulte-table:1.1.0
    container_name: schulte-table
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - TZ=Asia/Shanghai
