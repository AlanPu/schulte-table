# 舒尔特表 PWA — nginx 配置（群晖 / 任意 Docker 环境通用）
#
# 关键点：
#   1. .webmanifest 必须返回 application/manifest+json，否则部分浏览器不认安装条件
#   2. sw.js 与 index.html 不缓存，保证改动后 iPad 能拿到新版本
#   3. 静态资源长缓存，图标/样式走 30 天

server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    # Let's Encrypt / 群晖反向代理放行大一点的请求头
    client_max_body_size 4m;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   5;
    gzip_types        text/plain text/css text/javascript
                      application/javascript application/json
                      application/manifest+json image/svg+xml;

    # ---- 入口页：不缓存 ----
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff";
    }

    location = / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files /index.html =404;
    }

    # ---- Service Worker：不缓存，且显式声明 MIME ----
    location = /sw.js {
        default_type application/javascript;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }

    # ---- Web App Manifest：正确的 MIME 类型 ----
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ---- 样式与脚本：短缓存（内容变了靠 SW 的 SWR 兜底）----
    location ~* \.(?:css|js)$ {
        add_header Cache-Control "public, max-age=600";
    }

    # ---- 图标：长缓存 ----
    location ~* \.(?:png|jpe?g|webp|svg|ico)$ {
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # ---- 其余一律回落到入口页（单页应用）----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静默常见的探测请求
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        try_files /icons/icon-192.png =204;
    }
}
