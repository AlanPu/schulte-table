# 舒尔特表 PWA — 群晖 Container Manager 项目
#
# 用法：在 Container Manager → 项目 → 新增，路径指向本文件所在目录即可。
# 挂载式部署：改 site/ 里的文件后无需重建镜像，刷新浏览器就生效。
#
# 端口 14174 是 NAS 侧的访问端口（右边固定 80 是容器内 nginx，别动）。
# 若 14174 也被占用，改左边的数字即可，后续访问地址同步改。

services:
  schulte-table:
    image: nginx:alpine
    container_name: schulte-table
    restart: unless-stopped
    ports:
      - "14174:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
