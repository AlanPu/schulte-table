# 舒尔特表 PWA — 群晖 Container Manager 项目
#
# 用法：在 Container Manager → 项目 → 新增，路径指向本文件所在目录即可。
# 挂载式部署：改 site/ 里的文件后无需重建镜像，刷新浏览器就生效。
#
# 端口 8080 可改成你喜欢的（左边是 NAS 端口，右边固定 80 别动）。

services:
  schulte-table:
    image: nginx:alpine
    container_name: schulte-table
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
